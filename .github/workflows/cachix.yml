name: cachix
on:
  push:
    branches:
      - main
    paths: # what overlays/patched.nix builds from; flake.lock also moves on every unrelated bump, the cache check below makes those runs a no-op
      - overlays/patched.nix
      - overlays/*.patch
      - flake.lock
      - outputs/default.nix
      - .github/workflows/cachix.yml
  workflow_dispatch: {}
concurrency:
  group: cachix
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: valeratrades
      - name: build patched packages
        run: |
          for p in wtype baresip keepassxc tmux nix-direnv excalidraw_export nixd; do
            out=$(nix eval --raw ".#legacyPackages.x86_64-linux.patched.$p.outPath")
            if nix path-info --store https://valeratrades.cachix.org "$out" >/dev/null 2>&1; then
              echo "$p: cached"
              continue
            fi
            nix build -L --no-link ".#legacyPackages.x86_64-linux.patched.$p"
          done
