<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>arch -- Excalidraw</title>
  <style>
    html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    #save-indicator {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: #fff; padding: 4px 14px;
      border-radius: 6px; font: 13px monospace; opacity: 0;
      transition: opacity 0.3s; pointer-events: none; z-index: 9999;
    }
  </style>
  <link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@0.18.1/dist/prod/index.css" />
  <script type="importmap">
    { "imports": {
      "react": "https://esm.sh/react@19.1.0",
      "react/": "https://esm.sh/react@19.1.0/",
      "react-dom": "https://esm.sh/react-dom@19.1.0",
      "react-dom/": "https://esm.sh/react-dom@19.1.0/"
    } }
  </script>
</head>
<body>
  <div id="root"></div>
  <div id="save-indicator">saved</div>
  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import {
      Excalidraw, LiveCollaborationTrigger, CaptureUpdateAction, newElementWith,
      restoreElements, reconcileElements, bumpVersion, getSceneVersion, isInvisiblySmallElement
    } from 'https://esm.sh/@excalidraw/excalidraw@0.18.1/dist/prod/index.js?external=react,react-dom';
    import { io } from 'https://esm.sh/socket.io-client@4.8.1';
    var h = React.createElement;
    var excalidrawAPI = null;
    var indicator = document.getElementById('save-indicator');
    var indicatorTimer = null;

    function showIndicator(msg) {
      indicator.textContent = msg;
      indicator.style.opacity = '1';
      clearTimeout(indicatorTimer);
      indicatorTimer = setTimeout(function() { indicator.style.opacity = '0'; }, 1500);
    }

    var SAVE_APP_STATE_KEYS = [
      'gridSize', 'viewBackgroundColor', 'theme',
      'currentItemStrokeColor', 'currentItemBackgroundColor',
      'currentItemFillStyle', 'currentItemStrokeWidth',
      'currentItemStrokeStyle', 'currentItemRoughness',
      'currentItemOpacity', 'currentItemFontFamily',
      'currentItemFontSize', 'currentItemTextAlign',
      'currentItemStartArrowhead', 'currentItemEndArrowhead',
      'currentItemRoundness', 'exportBackground',
      'exportWithDarkMode', 'exportScale', 'exportEmbedScene',
      'name', 'zenModeEnabled', 'objectsSnapModeEnabled',
      'scrollX', 'scrollY', 'zoom'
    ];

    function saveNow() {
      if (!excalidrawAPI) return;
      var elements = excalidrawAPI.getSceneElements();
      var fullState = excalidrawAPI.getAppState();
      var files     = excalidrawAPI.getFiles();
      var appState = {};
      SAVE_APP_STATE_KEYS.forEach(function(k) {
        if (k in fullState) appState[k] = fullState[k];
      });
      fetch('/api/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          type: 'excalidraw',
          version: 2,
          source: 'http://localhost:3741',
          elements: elements,
          appState: appState,
          files: files || {}
        })
      }).then(function() {
        showIndicator('saved');
      }).catch(function() {
        showIndicator('save failed');
      });
    }

    // Step the canvas zoom by a multiplicative factor, clamped to Excalidraw's
    // own 0.1..30 bounds, keeping the viewport centered (matches the toolbar zoom).
    function stepZoom(factor) {
      if (!excalidrawAPI) return;
      var st = excalidrawAPI.getAppState();
      var cur = (st.zoom && st.zoom.value) || 1;
      var next = Math.min(30, Math.max(0.1, cur * factor));
      // Snap to exactly 100% when passing near it: canvas text is rasterized at
      // zoom*dpr, and only an exact 1.0 keeps glyphs on the pixel grid; the
      // multiplicative ladder would otherwise drift fractional forever.
      if (Math.abs(next - 1) < 0.01) next = 1;
      var cx = st.width / 2, cy = st.height / 2;
      // Anchor the zoom on the viewport center. Excalidraw maps scene->screen as
      // screen = (scene + scroll) * zoom, so scene = screen/zoom - scroll. Keep the
      // scene point under the center fixed as the zoom value changes.
      var sceneX = cx / cur - st.scrollX;
      var sceneY = cy / cur - st.scrollY;
      var scrollX = cx / next - sceneX;
      var scrollY = cy / next - sceneY;
      excalidrawAPI.updateScene({ appState: { zoom: { value: next }, scrollX: scrollX, scrollY: scrollY } });
    }

    // Pan the viewport by a fraction of its size, in scene units (so the visual
    // distance is constant regardless of zoom). Excalidraw maps scene->screen as
    // screen = (scene + scroll) * zoom, so a screen delta of d px is d/zoom in scroll.
    function panBy(dxScreen, dyScreen) {
      if (!excalidrawAPI) return;
      var st = excalidrawAPI.getAppState();
      var z = (st.zoom && st.zoom.value) || 1;
      excalidrawAPI.updateScene({ appState: {
        scrollX: st.scrollX - dxScreen / z,
        scrollY: st.scrollY - dyScreen / z
      } });
    }

    var PAN_KEYS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };

    // Scale the selected elements by `factor` about their common bounding-box
    // center, so the group stays put while growing/shrinking. Geometry, font size,
    // and relative line/arrow/freedraw points all scale together.
    function scaleSelection(factor) {
      if (!excalidrawAPI) return;
      var sel = excalidrawAPI.getAppState().selectedElementIds || {};
      var all = excalidrawAPI.getSceneElements();
      var picked = all.filter(function(el) { return sel[el.id] && !el.isDeleted; });
      if (!picked.length) return;
      // Common center of the selection's bounding box.
      var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      picked.forEach(function(el) {
        minX = Math.min(minX, el.x); minY = Math.min(minY, el.y);
        maxX = Math.max(maxX, el.x + el.width); maxY = Math.max(maxY, el.y + el.height);
      });
      var cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
      var picks = {};
      picked.forEach(function(el) { picks[el.id] = true; });
      var next = all.map(function(el) {
        if (!picks[el.id]) return el;
        var u = {
          x: cx + (el.x - cx) * factor,
          y: cy + (el.y - cy) * factor,
          width: el.width * factor,
          height: el.height * factor
        };
        if (typeof el.fontSize === 'number') u.fontSize = el.fontSize * factor;
        // Line/arrow/freedraw carry geometry as points relative to (x,y).
        if (el.points) u.points = el.points.map(function(p) { return [p[0] * factor, p[1] * factor]; });
        return newElementWith(el, u);
      });
      excalidrawAPI.updateScene({ elements: next, captureUpdate: CaptureUpdateAction.IMMEDIATELY });
    }

    function inTextInput(t) {
      return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
    }

    // Drive the Opacity slider in the left panel. React owns the input, so the
    // value must go through the native setter for the synthetic onChange to see it.
    function setPanelOpacity(value) {
      var slider = document.querySelector('.excalidraw input[type="range"]');
      if (!slider) return false;
      Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set.call(slider, value);
      slider.dispatchEvent(new Event('input', { bubbles: true }));
      return true;
    }

    // Click the Nth (0-based) radio in the Stroke width row: thin / bold / extra-bold.
    function setStrokeWidth(n) {
      var sets = document.querySelectorAll('.excalidraw fieldset');
      for (var i = 0; i < sets.length; i++) {
        var legend = sets[i].querySelector('legend');
        if (legend && /stroke width/i.test(legend.textContent)) {
          var radios = sets[i].querySelectorAll('input[type="radio"]');
          if (radios[n]) { radios[n].click(); return true; }
          return false;
        }
      }
      return false;
    }

    // Click the Nth button of the Stroke color row in the left panel (1-5 are the
    // quick-pick swatches, 6 is the active-color button that opens the full
    // picker pane). Position-based: whatever color sits there is what gets picked.
    // The Stroke section is the one whose active-color button is aria-labelled
    // "Stroke"; Background has its own identical row we must not hit.
    function clickStrokeSwatch(n) {
      var actives = document.querySelectorAll('.color-picker__button.active-color');
      var strokeActive = null;
      for (var i = 0; i < actives.length; i++) {
        var lbl = (actives[i].getAttribute('aria-label') || '').toLowerCase();
        if (lbl.indexOf('stroke') !== -1) { strokeActive = actives[i]; break; }
      }
      // Fallback: the Stroke row is the first color picker rendered in the panel.
      if (!strokeActive && actives.length) strokeActive = actives[0];
      if (!strokeActive) return false;
      if (n === 6) { strokeActive.click(); return true; }
      var picks = strokeActive.parentElement.querySelector('.color-picker__top-picks');
      if (!picks) return false;
      var btn = picks.querySelectorAll('button')[n - 1];
      if (!btn) return false;
      btn.click();
      return true;
    }

    // Bubble phase, preventDefault only — never stopPropagation. Capture phase plus
    // blanket stopPropagation here froze the app: keyups still reached Excalidraw
    // while their keydowns were swallowed, desyncing its key/pan state machine.
    // preventDefault is enough to keep our zoom/pan from also triggering natives.
    document.addEventListener('keydown', function(e) {
      // Save fires from anywhere, including mid text-edit.
      if (e.altKey && e.key === 'w') {
        e.preventDefault();
        saveNow();
        return;
      }
      // Alt+R — flip light/dark. Works at runtime because the `theme` prop only
      // forces state when the prop itself changes (it never does after mount).
      if (e.altKey && e.key === 'r') {
        e.preventDefault();
        if (excalidrawAPI) {
          var cur = excalidrawAPI.getAppState().theme;
          excalidrawAPI.updateScene({ appState: { theme: cur === 'dark' ? 'light' : 'dark' } });
        }
        return;
      }
      // Alt+1/2 — opacity 50/100; Alt+3/4/5 — stroke width thin/bold/extra-bold.
      // Inert unless the properties panel is open (its controls exist in the DOM);
      // allowed mid text-edit since Alt+digit never types a character.
      if (e.altKey && !e.ctrlKey && !e.metaKey && e.key >= '1' && e.key <= '5') {
        var done = e.key === '1' ? setPanelOpacity(50)
          : e.key === '2' ? setPanelOpacity(100)
          : setStrokeWidth(e.key - '3');
        if (done) {
          e.preventDefault();
            }
        return;
      }
      // Every binding below is canvas-only: while editing text, do nothing custom
      // and (crucially) never preventDefault, so the keypress lands in the input
      // normally — Shift+- types '_', arrows move the caret.
      if (inTextInput(e.target)) return;
      // Shift +/- — grow/shrink the selected elements; with nothing selected it's
      // just another way to zoom (same split as arrows: nudge vs pan). Shift+=
      // yields '+' and Shift+- yields '_' on most layouts, so match those glyphs.
      if (e.shiftKey && !e.ctrlKey && !e.altKey && !e.metaKey && (e.key === '+' || e.key === '_')) {
        e.preventDefault();
          var factor = e.key === '_' ? 1 / 1.1 : 1.1;
        var picked = excalidrawAPI ? excalidrawAPI.getAppState().selectedElementIds || {} : {};
        if (Object.keys(picked).length) scaleSelection(factor); else stepZoom(factor);
        return;
      }
      // Ctrl+1..6 — pick the Nth button in the Stroke color row of the panel.
      if (e.ctrlKey && !e.altKey && !e.metaKey && !e.shiftKey && e.key >= '1' && e.key <= '6') {
        if (clickStrokeSwatch(+e.key)) {
          e.preventDefault();
          return;
        }
      }
      if (!e.ctrlKey && !e.altKey && !e.metaKey && (e.key === '-' || e.key === '_')) {
        e.preventDefault();
          stepZoom(1 / 1.1);
      } else if (!e.ctrlKey && !e.altKey && !e.metaKey && (e.key === '=' || e.key === '+')) {
        e.preventDefault();
          stepZoom(1.1);
      } else if (e.shiftKey && !e.ctrlKey && !e.altKey && !e.metaKey && (e.key === '0' || e.key === ')')) {
        // Re-anchor: scroll the content back to the viewport center, preserving
        // the current zoom level (no fit, so it won't rescale your drawing).
        e.preventDefault();
          if (excalidrawAPI) excalidrawAPI.scrollToContent(undefined, { fitToContent: false });
      } else if (PAN_KEYS[e.key] && !e.ctrlKey && !e.altKey && !e.metaKey && excalidrawAPI) {
        // Arrows pan the viewport — but only when nothing is selected, so the
        // native "nudge selected element" behavior is preserved when it matters.
        var sel = excalidrawAPI.getAppState().selectedElementIds || {};
        if (Object.keys(sel).length) return;
        e.preventDefault();
          // 80px screen step, ×4 with Shift for coarse panning.
        var step = e.shiftKey ? 320 : 80;
        var dir = PAN_KEYS[e.key];
        panBy(dir[0] * step, dir[1] * step);
      }
    });

    // Esc deselect lives in its own CAPTURE-phase listener: Excalidraw's own
    // document keydown calls stopImmediatePropagation on Escape, so a bubble-phase
    // handler never sees it. Capture runs on the way down, before Excalidraw can
    // stop it. We don't preventDefault — Excalidraw still gets to run its Escape
    // (closing popups etc.); we just additionally force-clear the selection on the
    // next macrotask so the cleared state is the one that sticks.
    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Escape' || e.ctrlKey || e.altKey || e.metaKey || e.shiftKey || !excalidrawAPI) return;
      // If we're editing text, this Esc just exits the editor (default behavior
      // already drops back to the element being selected). Don't also deselect —
      // that takes a second, separate Esc.
      if (inTextInput(e.target)) return;
      setTimeout(function() {
        var s = excalidrawAPI.getAppState();
        if (Object.keys(s.selectedElementIds || {}).length || Object.keys(s.selectedGroupIds || {}).length) {
          excalidrawAPI.updateScene({ appState: { selectedElementIds: {}, selectedGroupIds: {} } });
        }
      }, 0);
    }, true);

    // Live collab against excalidraw.com rooms; protocol mirrors excalidraw-app/collab/{Collab,Portal}.tsx.
    // The socket goes through our server, which relays it to oss-collab with an excalidraw.com Origin.
    var USERNAME = '__USERNAME__';
    var DELETED_ELEMENT_TIMEOUT = 24 * 60 * 60 * 1000;
    var SYNC_FULL_SCENE_INTERVAL_MS = 20000;
    var CURSOR_SYNC_TIMEOUT = 33;
    var collab = null; // { socket, roomId, roomKey, cryptoKey, link, broadcasted: Map<id, version>, lastVersion, collaborators: Map }

    async function startCollab() {
      var idBytes = crypto.getRandomValues(new Uint8Array(10));
      var roomId = Array.from(idBytes, function(b) { return b.toString(16).padStart(2, '0'); }).join('');
      var cryptoKey = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 128 }, true, ['encrypt', 'decrypt']);
      var roomKey = (await crypto.subtle.exportKey('jwk', cryptoKey)).k;
      var socket = io(location.origin, { transports: ['websocket'] });
      collab = {
        socket: socket, roomId: roomId, roomKey: roomKey, cryptoKey: cryptoKey,
        link: 'https://excalidraw.com/#room=' + roomId + ',' + roomKey,
        broadcasted: new Map(), lastVersion: -1, collaborators: new Map()
      };
      socket.on('init-room', function() { socket.emit('join-room', roomId); });
      socket.on('new-user', function() {
        var all = excalidrawAPI.getSceneElementsIncludingDeleted();
        broadcastScene('SCENE_INIT', all, true);
        // a peer whose 5s init fallback already fired (slow load) drops SCENE_INIT; we have no Firebase copy for it to find
        broadcastScene('SCENE_UPDATE', all, true);
      });
      socket.on('room-user-change', setCollaborators);
      socket.on('client-broadcast', onClientBroadcast);
      socket.on('connect_error', function(e) { showIndicator('collab: ' + e.message); });
      setInterval(function() { broadcastScene('SCENE_UPDATE', excalidrawAPI.getSceneElementsIncludingDeleted(), true); }, SYNC_FULL_SCENE_INTERVAL_MS);
      console.log('collab link:', collab.link);
    }

    function copyCollabLink() {
      navigator.clipboard.writeText(collab.link).then(
        function() { showIndicator('share link copied'); },
        function(e) { showIndicator('clipboard failed: ' + e.message); console.log('collab link:', collab.link); }
      );
    }

    function isSyncable(el) {
      if (el.isDeleted) return el.updated > Date.now() - DELETED_ELEMENT_TIMEOUT;
      return !isInvisiblySmallElement(el);
    }

    async function broadcast(data, volatile) {
      var iv = crypto.getRandomValues(new Uint8Array(12));
      var buf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, collab.cryptoKey, new TextEncoder().encode(JSON.stringify(data)));
      collab.socket.emit(volatile ? 'server-volatile-broadcast' : 'server-broadcast', collab.roomId, buf, iv);
    }

    function broadcastScene(type, elements, syncAll) {
      var picked = elements.filter(function(el) {
        var prev = collab.broadcasted.get(el.id);
        return (syncAll || prev === undefined || el.version > prev) && isSyncable(el);
      });
      picked.forEach(function(el) { collab.broadcasted.set(el.id, el.version); });
      collab.lastVersion = Math.max(collab.lastVersion, getSceneVersion(elements));
      return broadcast({ type: type, payload: { elements: picked } });
    }

    async function onClientBroadcast(encrypted, iv) {
      var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(iv) }, collab.cryptoKey, encrypted);
      var data = JSON.parse(new TextDecoder().decode(plain));
      switch (data.type) {
        case 'SCENE_INIT':
        case 'SCENE_UPDATE': {
          var local = excalidrawAPI.getSceneElementsIncludingDeleted();
          var localById = new Map(local.map(function(el) { return [el.id, el]; }));
          var remote = restoreElements(data.payload.elements, local);
          // bumpElementVersions from excalidraw-app: keep our version ahead so our next broadcast wins over the echo
          var merged = reconcileElements(local, remote, excalidrawAPI.getAppState()).map(function(el) {
            var l = localById.get(el.id);
            return l && (l.version > el.version || (l.version === el.version && l.versionNonce !== el.versionNonce)) ? bumpVersion(el, l.version) : el;
          });
          collab.lastVersion = getSceneVersion(merged);
          excalidrawAPI.updateScene({ elements: merged, captureUpdate: CaptureUpdateAction.NEVER });
          break;
        }
        case 'MOUSE_LOCATION':
          updateCollaborator(data.payload.socketId, {
            pointer: data.payload.pointer, button: data.payload.button,
            selectedElementIds: data.payload.selectedElementIds, username: data.payload.username
          });
          break;
        case 'IDLE_STATUS':
          updateCollaborator(data.payload.socketId, { userState: data.payload.userState, username: data.payload.username });
          break;
        case 'USER_VISIBLE_SCENE_BOUNDS': break; // shortcut: following others isn't wired, add if wanted
        default: throw new Error('unknown collab message type ' + data.type);
      }
    }

    function setCollaborators(socketIds) {
      var next = new Map();
      socketIds.forEach(function(id) {
        var me = id === collab.socket.id;
        next.set(id, Object.assign(me ? { username: USERNAME } : {}, collab.collaborators.get(id), { isCurrentUser: me }));
      });
      collab.collaborators = next;
      excalidrawAPI.updateScene({ collaborators: next });
    }

    function updateCollaborator(id, updates) {
      var next = new Map(collab.collaborators);
      next.set(id, Object.assign({}, next.get(id), updates, { isCurrentUser: id === collab.socket.id }));
      collab.collaborators = next;
      excalidrawAPI.updateScene({ collaborators: next });
    }

    function onSceneChange(elements) {
      if (!collab || getSceneVersion(elements) <= collab.lastVersion) return;
      broadcastScene('SCENE_UPDATE', elements, false);
    }

    var lastPointerSent = 0;
    function onPointerUpdate(p) {
      if (!collab || !collab.socket.id || p.pointersMap.size >= 2) return;
      var now = Date.now();
      if (now - lastPointerSent < CURSOR_SYNC_TIMEOUT) return;
      lastPointerSent = now;
      broadcast({ type: 'MOUSE_LOCATION', payload: {
        socketId: collab.socket.id, pointer: p.pointer, button: p.button || 'up',
        selectedElementIds: excalidrawAPI.getAppState().selectedElementIds, username: USERNAME
      } }, true);
    }

    function sendHeartbeat() {
      fetch('/api/heartbeat', { method: 'POST' }).catch(function() {
        document.getElementById('root').style.display = 'none';
        document.body.style.background = '#1e1e1e';
        document.body.style.color = '#aaa';
        document.body.style.display = 'flex';
        document.body.style.alignItems = 'center';
        document.body.style.justifyContent = 'center';
        document.body.style.font = '24px monospace';
        document.body.textContent = 'server stopped';
      });
    }
    // Arm the server watchdog ASAP — first setInterval tick is 3s away.
    sendHeartbeat();
    setInterval(sendHeartbeat, 3000);

    fetch('/api/load')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        function App() {
          var [collabOn, setCollabOn] = React.useState(false);
          return h(Excalidraw, {
            theme: '__THEME__',
            isCollaborating: collabOn,
            onChange: onSceneChange,
            onPointerUpdate: onPointerUpdate,
            renderTopRightUI: function() {
              return h(LiveCollaborationTrigger, {
                isCollaborating: collabOn,
                onSelect: function() {
                  if (collab) { copyCollabLink(); return; }
                  startCollab().then(function() { setCollabOn(true); copyCollabLink(); });
                }
              });
            },
            initialData: {
              elements: data.elements || [],
              appState: Object.assign({ currentItemFontFamily: 3, currentItemOpacity: 50, currentItemStrokeWidth: 1 }, data.appState || {}, { viewBackgroundColor: '__VIEW_BG_COLOR__' }),
              files: data.files || {}
            },
            excalidrawAPI: function(api) {
              excalidrawAPI = api;
              // Force theme + canvas bg AFTER mount. initialData.appState gets
              // mangled by Excalidraw's internal restore(), so we re-assert here
              // via the public updateScene API which nothing can override.
              var post = { viewBackgroundColor: '__VIEW_BG_COLOR__', theme: '__THEME__' };
              // restore() also drops the saved viewport, so re-assert scroll/zoom
              // from the loaded file to reopen at the same place and zoom level.
              var saved = data.appState || {};
              if (typeof saved.scrollX === 'number') post.scrollX = saved.scrollX;
              if (typeof saved.scrollY === 'number') post.scrollY = saved.scrollY;
              if (saved.zoom && typeof saved.zoom.value === 'number') post.zoom = { value: saved.zoom.value };
              api.updateScene({ appState: post });
              fetch('/api/libraries')
                .then(function(r) { return r.json(); })
                .then(function(libs) {
                  if (!libs || !libs.length) return;
                  var items = [];
                  libs.forEach(function(lib) {
                    // v2 format: lib.libraryItems is array of {id, status, elements, ...}
                    if (lib.libraryItems) {
                      lib.libraryItems.forEach(function(item) { items.push(item); });
                    }
                    // v1 format: lib.library is array of element-arrays
                    if (lib.library) {
                      lib.library.forEach(function(elements, i) {
                        items.push({
                          id: lib.source + '_' + i,
                          status: 'published',
                          elements: elements,
                          created: 1
                        });
                      });
                    }
                  });
                  if (items.length) {
                    api.updateLibrary({ libraryItems: items, merge: true });
                  }
                });
            }
          });
        }
        createRoot(document.getElementById('root')).render(h(App));
      });
  </script>
</body>
</html>
