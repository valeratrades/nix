# Anthropic and OpenAI behind one endpoint, for `clm` (llm.fish).
#
# Claude Code resolves exactly one ANTHROPIC_BASE_URL per process, so the only way to reach an
# OpenAI model from a Claude session is to put both providers behind one proxy and map them onto
# the three tier variables. The consequence is unavoidable and not free: Opus here authenticates
# with ANTHROPIC_API_KEY, so the main loop bills API credits rather than the Max subscription.
#
# See openai.yaml for why the gpt-5.6 entries need mode/supports_tool_choice spelled out.
model_list:
  - model_name: opus
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: terra
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: responses
      supports_tool_choice: true

  - model_name: luna
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: responses
      supports_tool_choice: true
