# Anthropic and OpenAI behind one endpoint, for `clm` (llm.fish).
#
# Claude Code resolves exactly one ANTHROPIC_BASE_URL per process, so the only way to reach an
# OpenAI model from a Claude session is to put both providers behind one proxy. The three
# ANTHROPIC_DEFAULT_*_MODEL variables pick the *defaults*; every group below is also reachable
# directly as `clm -m <group>`, which is the point of registering more than three.
# The consequence is unavoidable and not free: Anthropic models authenticate with
# ANTHROPIC_API_KEY here, so a session on one bills API credits rather than the Max subscription.
#
# OpenAI groups name both the billing source and model: `token-*` bills OPENAI_API_KEY; `sub-*`
# bills the ChatGPT subscription through Codex OAuth. Both lists are enumerated from their model
# endpoints rather than assumed equivalent. Subscription tokens live in $CHATGPT_TOKEN_DIR, set
# by `clm`.
#
# See openai.yaml for why OpenAI entries need mode/supports_tool_choice spelled out.
# `allowed_openai_params` only gets Claude Code's `context_management` past litellm's parameter
# check; the chatgpt transform then strips it, as the Codex backend has no equivalent -- so
# context editing is a no-op on `sub-*` groups.
#
# Known defect, litellm 1.83.7, OpenAI groups only: translating Anthropic tool_choice to the
# Responses API, the string-valued modes get wrapped in an object -- `{"type":"auto"}` and
# `{"type":"required"}` -- where the API wants a bare string, and 400s. Omitted tool_choice and
# the named form `{"type":"tool","name":...}` both work, and Claude Code's agent loop omits it,
# which is why sessions run fine. Forced-tool flows against OpenAI groups will fail loudly.
# Anthropic groups are unaffected. Fixed by a litellm bump, not by anything in this file.
litellm_settings:
  callbacks: hooks.proxy_handler_instance # clamps max_tokens; see hooks.py

model_list:
  # -- Anthropic -------------------------------------------------------------------------------
  - model_name: opus
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: fable
    litellm_params:
      model: anthropic/claude-fable-5-1
      api_key: os.environ/ANTHROPIC_API_KEY

  # `cl -f` passes `--model claude-fable-5-1` verbatim, so the raw id has to resolve too or the
  # utmost_importance_projects guard in llm.fish 400s under `clm`.
  - model_name: claude-fable-5-1
    litellm_params:
      model: anthropic/claude-fable-5-1
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: haiku
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # -- OpenAI, per-token ----------------------------------------------------------------------
  - model_name: token-sol
    litellm_params:
      model: openai/gpt-6.1-sol
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: responses
      supports_tool_choice: true

  - model_name: token-terra
    litellm_params:
      model: openai/gpt-6.1-terra
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: responses
      supports_tool_choice: true

  - model_name: token-luna
    litellm_params:
      model: openai/gpt-6-luna
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: responses
      supports_tool_choice: true

  - model_name: token-astra
    litellm_params:
      model: openai/gpt-6-astra
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: responses
      supports_tool_choice: true

  - model_name: token-pro
    litellm_params:
      model: openai/gpt-5.5-pro
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: responses
      supports_tool_choice: true

  # -- OpenAI, ChatGPT subscription -----------------------------------------------------------
  - model_name: sub-sol
    litellm_params:
      model: chatgpt/gpt-6.1-sol
      allowed_openai_params: [context_management]
    model_info:
      mode: responses
      supports_tool_choice: true

  - model_name: sub-terra
    litellm_params:
      model: chatgpt/gpt-6.1-terra
      allowed_openai_params: [context_management]
    model_info:
      mode: responses
      supports_tool_choice: true

  - model_name: sub-luna
    litellm_params:
      model: chatgpt/gpt-6-luna
      allowed_openai_params: [context_management]
    model_info:
      mode: responses
      supports_tool_choice: true

  - model_name: sub-astra
    litellm_params:
      model: chatgpt/gpt-6-astra
      allowed_openai_params: [context_management]
    model_info:
      mode: responses
      supports_tool_choice: true
